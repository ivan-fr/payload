# Keep hand-written production code and CI workflows in the analysis.
sonar.sources=.
sonar.tests=.
sonar.sourceEncoding=UTF-8

# Fixture configs/helpers and colocated specs are test code, not product code.
# Keep analysing them with test rules rather than counting them as source duplication.
sonar.test.inclusions=test/**,**/*.spec.*,**/*.test.*,**/__tests__/**
sonar.exclusions=test/**,**/*.spec.*,**/*.test.*,**/__tests__/**,**/payload-types.ts,**/dist/**,**/node_modules/**,**/coverage/**

# Payload generates these declarations; regenerate them instead of editing their headers.
sonar.test.exclusions=**/payload-types.ts,**/dist/**,**/node_modules/**,**/coverage/**

# Locale modules are declarative message dictionaries with an intentionally shared key schema.
# Keep normal analysis enabled; exclude only these data resources from duplication detection.
# languageResources.spec.ts prevents executable logic from entering this resource-only scope.
sonar.cpd.exclusions=packages/translations/src/languages/*.ts
